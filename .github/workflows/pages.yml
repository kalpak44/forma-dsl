name: Pages

# The site is the editor at the root and the reference docs under /docs/. Both come out of
# `npm run build`, so what is published is exactly what CI already builds on every pull
# request — including the docs link checker, which fails the build rather than shipping a
# dead cross-reference.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway: a run that is killed mid-deploy
# leaves the site serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install
        run: npm ci

      # `enablement` turns Pages on for the repository if it is off, so the first deploy
      # works from a clean checkout — a fork, or this repository before anyone visited the
      # settings page — rather than failing with "Get Pages site failed".
      - uses: actions/configure-pages@v6
        id: pages
        with:
          enablement: true

      # Pages serves a project site from /<repo>/, so every absolute asset URL has to carry
      # that prefix. `configure-pages` works the path out from the repository itself rather
      # than it being hard-coded here and going stale if the repo is renamed.
      - name: Build the site
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # The run summary is where someone lands from a commit status, so the deployed URLs
      # belong there rather than only in the deploy step's log. The URL goes through `env`
      # rather than being interpolated into the script, so it stays data rather than shell.
      - name: Summarise the deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          # `page_url` normally carries a trailing slash; trimming first means the paths
          # below are right whether or not it does.
          base="${PAGE_URL%/}"
          {
            echo "## Deployed"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Editor | [$base/]($base/) |"
            echo "| Reference docs | [$base/docs/]($base/docs/) |"
          } >> "$GITHUB_STEP_SUMMARY"
