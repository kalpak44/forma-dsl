name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pinned rather than `ubuntu-latest`: that label migrates to Ubuntu 26 on 19 October 2026,
# and a runner image changing under the build is not something CI should discover for
# itself. Bump it deliberately.
jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The floor is what the toolchain actually supports: Vite 7 and ESLint 10 both
        # require 20.19, and ESLint additionally rules out 22.0–22.12.
        node: ['20.19', '22.13', '24.x']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check the published type declarations
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  package:
    name: Package contents
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      # The published tarball must carry the library and nothing else. A stray web/ or
      # test/ here means `files` in package.json drifted.
      - name: Inspect the publishable tarball
        run: npm run check:package
