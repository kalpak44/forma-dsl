name: Release

# Publishing is a tag, not a branch: a push to `main` never reaches npm. The tag is also
# the version — the job refuses to publish if it disagrees with the package.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read
  # Required for npm provenance: the attestation is signed with the workflow's OIDC
  # identity, which is what ties the published tarball to this repository and this run.
  id-token: write

# Pinned rather than `ubuntu-latest`: that label migrates to Ubuntu 26 on 19 October 2026,
# and a runner image changing under a release is worse than under a build.
jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      # A tag that disagrees with the manifest publishes a version nobody asked for, under
      # a name that already implies a different one. Cheaper to catch here than to
      # deprecate afterwards.
      - name: Check the tag against the manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./packages/forma-dsl/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match packages/forma-dsl version $version"
            exit 1
          fi
          echo "publishing forma-dsl@$version"

      # The same gate every pull request passes. A release is the one place where skipping
      # it to save ninety seconds is least defensible.
      - name: Check
        run: npm run check

      - name: Publish
        if: ${{ github.event_name == 'push' }}
        run: npm publish -w forma-dsl --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack only
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm pack -w forma-dsl --dry-run

      - name: Summarise
        env:
          PUBLISHED: ${{ github.event_name == 'push' }}
        run: |
          version=$(node -p "require('./packages/forma-dsl/package.json').version")
          {
            if [ "$PUBLISHED" = "true" ]; then
              echo "## Published \`forma-dsl@$version\`"
              echo
              echo "- [npm](https://www.npmjs.com/package/forma-dsl/v/$version)"
              echo "- \`npm install forma-dsl@$version\`"
            else
              echo "## Dry run for \`forma-dsl@$version\`"
              echo
              echo "Nothing was published. Push a \`v$version\` tag to release it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
