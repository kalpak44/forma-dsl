<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>forma-dsl</title>
<meta name="description" content="A declarative DSL for 3D modeling and scene composition, with reusable components and a live browser preview solved by the Manifold CSG kernel.">
<meta name="color-scheme" content="dark">
<!-- Inlined so the page costs no extra request and never logs a 404 for a missing icon. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M16 5l9 5.2v10.6L16 26l-9-5.2V10.2z' fill='none' stroke='%2382aaff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0d1117; --panel: #12161c; --line: #222a35; --text: #d6deeb;
    --muted: #7c8b9d; --accent: #82aaff; --ok: #6ec49a; --err: #ff6b7f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-rows: auto 1fr; background: var(--bg); color: var(--text);
    font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 9px 14px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .brand { font-weight: 700; letter-spacing: .02em; }
  .brand span { color: var(--accent); }
  .grow { flex: 1; }
  button, select {
    background: #1b212b; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  header a { color: var(--muted); text-decoration: none; }
  header a:hover { color: var(--accent); }
  label.toggle { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  main { display: grid; grid-template-columns: minmax(360px, 44%) minmax(0, 1fr); min-height: 0; }
  .pane { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
  #editor { min-height: 0; overflow: hidden; }
  #problem {
    padding: 8px 12px; border-top: 1px solid var(--line); background: #1d1216;
    color: var(--err); font-family: ui-monospace, Menlo, monospace; white-space: pre-wrap;
  }

  .view { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
  #canvas { width: 100%; height: 100%; min-height: 0; display: block; }
  .dock { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 14px; }
  .status { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); }
  .status.ok { color: var(--ok); } .status.error { color: var(--err); } .status.busy { color: var(--accent); }
  #parts { color: var(--muted); font-size: 12px; margin-top: 2px; }

  #fatal {
    position: fixed; inset: 0 0 auto 0; z-index: 10; padding: 14px 18px;
    background: #2a141a; color: var(--err); border-bottom: 1px solid var(--err);
    font-family: ui-monospace, Menlo, monospace;
  }
  /* Styled on an inner element, not on `noscript` itself: with scripting enabled the UA
     stylesheet hides the element, and a `display` rule here would fight it. */
  .noscript-note { padding: 16px 18px; color: var(--err); }

  #params { display: grid; gap: 7px; margin-top: 10px; max-height: 26vh; overflow: auto; }
  .param { display: grid; grid-template-columns: 8.5rem 3.5rem 1fr; align-items: center; gap: 10px; }
  .param-name { color: var(--accent); font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .param-value { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 12px; text-align: right; }
  .param input[type=range] { width: 100%; accent-color: var(--accent); }
  .param input[type=text] { background: #1b212b; color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 3px 7px; }
</style>
</head>
<body>
  <header>
    <div class="brand">forma<span>-dsl</span></div>
    <label class="sr-only" for="example">Load an example</label>
    <select id="example"><option value="">Load an example…</option></select>
    <div class="grow"></div>
    <!-- Built into dist/docs/ by scripts/build-docs.mjs, so this is dead during `npm run dev`. -->
    <a href="docs/">Docs</a>
    <label class="toggle"><input type="checkbox" id="edges"> edges</label>
    <button id="frame">Fit view</button>
    <button id="export">Export STL</button>
  </header>

  <div id="fatal" hidden role="alert"></div>

  <noscript><div class="noscript-note">forma-dsl parses and solves models in the browser, so it needs JavaScript enabled.</div></noscript>

  <main>
    <section class="pane">
      <div id="editor"></div>
      <div id="problem" hidden></div>
    </section>

    <section class="view">
      <canvas id="canvas"></canvas>
      <div class="dock">
        <div id="status" class="status busy">loading kernel…</div>
        <div id="parts"></div>
        <div id="params"></div>
      </div>
    </section>
  </main>

  <script type="module" src="/web/main.js"></script>
</body>
</html>
